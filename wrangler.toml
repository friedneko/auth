name = "auth"
main = "./dist/server/index.js"
compatibility_date = "2025-11-17"
compatibility_flags = ["nodejs_als", "nodejs_compat"]

# Custom domain: https://auth.vwinter.moe
# Add the route in the Cloudflare dashboard after deploying, or use:
#   wrangler route add auth.vwinter.moe/*
routes = [{ pattern = "auth.vwinter.moe/*", zone_name = "vwinter.moe" }]

# Pure SSG: static HTML/assets prerendered into dist/public, served from the
# Cloudflare Assets binding; the worker only handles RSC/fetch at runtime.
[assets]
binding = "ASSETS"
directory = "./dist/public"
html_handling = "drop-trailing-slash"

# dist/server is already transpiled to ES modules by waku build; wrangler must
# treat .js/.mjs as ESModule workers instead of bundling.
[[rules]]
type = "ESModule"
globs = ["**/*.js", "**/*.mjs"]

no_bundle = true
migrations_dir = "src/lib/db/migrations"

# Cloudflare D1 (SQLite) binding for Drizzle. The `DB` binding name matches the
# accessor used in `src/lib/db/client.ts` (getCloudflareContext().env.DB).
# `database_name` is the D1 instance name in your Cloudflare account; create it
# with `wrangler d1 create auth_db` and rename to match.
[[d1_databases]]
binding = "DB"
database_name = "auth_db"

# ---------------------------------------------------------------------------
# KV namespace for caching signing keys (D1 remains the source of truth).
# Namespace: auth_kv (binding: auth_kv), already created in Cloudflare dashboard.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "auth_kv"
id = "9acd7eeed03b41e1bd9d761f56057fbd"
preview_id = "9acd7eeed03b41e1bd9d761f56057fbd"

# ---------------------------------------------------------------------------
# IDP settings. The issuer is derived from the request URL by default, so
# these are only needed for specific overrides.
# ---------------------------------------------------------------------------
[vars]
# IDP_ADMIN_KEY = ""  # set via `wrangler secret put IDP_ADMIN_KEY` for remote bootstrap
